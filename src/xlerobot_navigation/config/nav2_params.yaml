# Nav2 for the XLeRobot base. Without slam:=true the map -> odom transform is a static
# identity published by navigation.launch.py and the global costmap is a rolling window,
# wheel odometry only. With slam:=true slam_toolbox publishes map and map -> odom and
# nav2_slam.yaml turns the global costmap into a static map layer, see slam.launch.py.
# The local costmap always has the LD19 obstacle layer.
#
# footprint is a rectangle covering the real extremities, not the (smaller) body_length x
# body_width chassis box: wheels stick out past the basket on y, and the rear caster sticks
# out past the chassis box on x. The front is +x, the drive-wheel end. Derived from
# robot_dimensions.yaml (wheel_separation 0.55, wheel_width 0.020, caster_front_x_offset 0.045,
# caster_rear_x_offset -0.259, caster_radius 0.0275), duplicated here by hand same as
# controllers.yaml's wheel_radius/wheel_separation.
#
# Velocity/acceleration limits match robot_dimensions.yaml's limits section exactly - don't
# raise these without raising them there too.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # diff_drive_controller has use_stamped_vel: true, see controllers.yaml.
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      max_linear_accel: 0.30
      max_linear_decel: 0.30
      lookahead_dist: 0.35
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      max_angular_accel: 1.0
      rotate_to_heading_angular_vel: 1.0
      min_turning_radius: 0.0
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      max_robot_pose_search_dist: 5.0
      # default 0.6 is bigger than most goals this robot will ever get - scaling was active
      # for the entire path instead of just the final approach, stalling short of
      # xy_goal_tolerance on a 0.45m test goal (confirmed via controller_server logging
      # "Failed to make progress" - real odom had stopped, not a reporting glitch).
      approach_velocity_scaling_dist: 0.15
      min_approach_linear_velocity: 0.05

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [0.30, 0.0, 1.0]
    max_decel: [-0.30, 0.0, -1.0]
    odom_topic: "/diff_drive_controller/odom"
    enable_stamped_cmd_vel: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.2
      use_astar: false

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    enable_stamped_cmd_vel: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: "/diff_drive_controller/odom"
    transform_tolerance: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # matches controller_frequency - a fast goal retry right after a progress-checker
      # abort hit "Costmap timed out waiting for update" against the old 2.0Hz rate.
      update_frequency: 10.0
      publish_frequency: 1.0
      footprint: "[[0.08, -0.29], [0.08, 0.29], [-0.30, 0.29], [-0.30, -0.29]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /ldlidar_node/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.30
          raytrace_max_range: 5.0
          raytrace_min_range: 0.30
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 0.5
      footprint: "[[0.08, -0.29], [0.08, 0.29], [-0.30, 0.29], [-0.30, -0.29]]"
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
