# Loaded after nav2_params.yaml when navigation.launch.py runs with slam:=true: the
# global costmap is the slam_toolbox map plus what the lidar sees now, not a rolling window.
global_costmap:
  global_costmap:
    ros__parameters:
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /ldlidar_node/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.30
          raytrace_max_range: 8.0
          raytrace_min_range: 0.30
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
