# Cameras started by cameras.launch.py (bringup cameras:=true). A camera whose
# device is not connected is skipped, so this can list all of them.
# Devices are the udev symlinks from tools/xlerobot_setup_usb_modules.py.
#
# Each camera publishes <name>/image_raw plus its transports, the video one is
# <name>/image_raw/ffmpeg (H.264 packets, what Rerun and the bag record).
#
# The cameras send MJPG, raw YUYV from three of them would not fit on USB 2.0.
# The Jetson's ffmpeg has no hardware encoder that works here (its NVENC is the
# desktop API), so encoding is libx264 in software, about 17% of one core per
# camera at 640x480 30 fps. libx264 needs the preset/tune options to open.
defaults:
  width: 640
  height: 480
  fps: 30.0
  pixel_format: mjpeg2rgb
  encoder: libx264
  encoder_options: "preset:ultrafast,tune:zerolatency"
  bit_rate: 2000000
  gop_size: 30

# frame_id is the camera's optical frame in the URDF (head from sensors.xacro, the
# wrist ones from so101_arm.xacro), so the video can be placed in the robot.
#
# head's frame_id is specifically the Gemini 2's own color-stream optical frame, confirmed
# live via its camera_info topic - not the usbcam-era "head_camera_optical_frame", and not
# "camera_color_optical_frame" either (that assumed the driver's frame names are fixed
# constants; they're actually "<camera_name>_..." - cameras.launch.py passes
# camera_name:="head", so the real name is head_color_optical_frame - see ADR-0003 and
# sensors.xacro's gemini branch). This value is read directly by the MCP server's
# CAMERA_FRAME_IDS (tools/mcp_server/bridge.py) for every sensor mode, not just usbcam - it's
# the TF frame capture_image/remember_object look up for the head camera's pose, so it must
# match whatever's actually live regardless of which sensor arg is in use.
# If sensor:=usbcam is used, this would need to change back to head's usbcam frame_id - not
# worth a fully dynamic config for a fallback path.
cameras:
  head:
    device: /dev/xle-cam-head
    frame_id: head_color_optical_frame
  left:
    device: /dev/xle-cam-left
    frame_id: left_arm_wrist_camera_optical_frame
  right:
    device: /dev/xle-cam-right
    frame_id: right_arm_wrist_camera_optical_frame
