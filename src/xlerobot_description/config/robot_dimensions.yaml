# XLeRobot 0.4.0 two-wheel base, physical dimensions.
#
# These are measurements, not constants. Anything marked TODO is a guess and is
# probably wrong. See ARCHITECTURE.md, calibration section.

xlerobot:
  base:
    # --- odometry critical, do these first ---
    #
    # Measured directly off the drive wheel: 125mm outer diameter.
    wheel_radius: 0.0625

    # Distance between the two wheel contact patches. diff_drive_controller calls
    # it wheel_separation. Measured 550mm - wider than the cart body itself
    # (405-459mm across upstream's own chassis collision boxes) and wider than
    # upstream's own reference URDF track (0.45m, wheels at y=+-0.225): the
    # custom drive-wheel axle bar extends past the basket on both sides, unlike
    # the stock cart's wheels which sit roughly flush with the body edge.
    wheel_separation: 0.55

    # UMBmark correction if the two wheels are not equal. 1.0 until measured.
    wheel_radius_scale_left: 1.0
    wheel_radius_scale_right: 1.0

    wheel_width: 0.020          # measured
    wheel_mass: 0.15            # TODO

    # --- chassis ---
    # length/height still IKEA RASKOG nominal, TODO check against the real
    # build. width corrected from upstream's own chassis collision boxes
    # (0.405-0.459m depending which cross-section) - the old 0.350 guess was
    # narrower than the actual cart.
    body_length: 0.450
    body_width:  0.405
    body_height: 0.780
    # x of the body box centre in base_link (drive axle is x=0), matched to the
    # centre of raskogbody.stl's footprint (x=-0.048 to 0.344). TODO check
    # against the real cart's front and rear edges.
    body_x_offset: 0.148

    # axle height above floor. Measured 62.5mm, same as wheel_radius - the
    # mount is not recessed.
    axle_height: 0.0625

    # axle offset from base_link, positive is forward. TODO
    axle_x_offset: 0.0

    # Four generic casters (front left/right, rear left/right) - the stock
    # cart's original four wheels are all still there, the drive wheels are
    # an addition on their own axle bar, not a replacement for any of
    # them. No encoder on any of them, so each is a fixed sphere in the URDF.
    # Diameter measured 55mm.
    caster_radius: 0.0275
    # base_link frame, front is +x (the drive-wheel end, where the arms and the
    # head camera face). The cart body mesh spans x=-0.345 to x=0.048 (drive axle
    # is x=0), the casters sit just inside its ends. Not measured against the real
    # robot's actual leg positions, just checked to not float in visibly empty
    # space, and taken from the shared upstream URDF's cart placement.
    caster_rear_x_offset: -0.31
    caster_front_x_offset: 0.04
    # TODO measure. Estimated from the corrected body_width (0.405m), not
    # measured directly - casters sit near the corners, inset a bit from
    # the body edge. Same value used for front and rear pairs.
    caster_y_offset: 0.15

    # Chassis only, no arms, no battery, no payload.
    # Don't copy the 70.1 kg from the upstream URDF, that is ManiSkill's loaded
    # cart scene and not this robot.
    # TODO weigh it.
    body_mass: 8.0
    com_height: 0.35            # TODO, this sets the tip over limits

  # --- speed limits ---
  # From the servo ceiling. Upstream clamps at max_raw = 3000 ticks/s:
  #   3000 / (4096/360) = 263.7 deg/s = 4.60 rad/s
  #   v_max = 4.60 * 0.0625 = 0.288 m/s
  # Keep Nav2 under these.
  limits:
    wheel_max_angular_velocity: 4.60   # rad/s, servo limit
    linear_velocity_max: 0.25          # m/s
    angular_velocity_max: 1.50         # rad/s
    # Low on purpose. Tall cart, two arms on top, narrow track.
    linear_acceleration_max: 0.30      # m/s^2
    angular_acceleration_max: 1.00     # rad/s^2

  # --- head pan/tilt, IDs 7 and 8 on bus1 ---
  head:
    # pan servo axis in the BODY frame (see base_2wheels.xacro: base_link turned 180
    # degrees about z, front is -x), the frame of the shared upstream URDF. The neck
    # and head parts are the ones in simulation/xlerobot/xlerobot.urdf of the
    # XLeRobot repo (xlerobot_urdf.zip).
    # x: measured, the mast axis is 70 mm from the front rim of the top basket, the
    #    one nearest the drive wheels, that rim is at x=-0.014 in the cart mesh, so
    #    0.056 (5.6 cm behind the axle line in base_link). The cart mesh position
    #    relative to the drive axle comes from that URDF and is not measured, so x
    #    is right relative to the cart, not yet to the wheels.
    # z: that URDF's value, TODO measure the pan axis height on the robot.
    mount_x: 0.056
    mount_y: 0.0
    mount_z: 1.053
    # that URDF's limits, TODO check against the mechanical stops
    pan_limit_lower: -3.2       # rad
    pan_limit_upper:  3.2
    tilt_limit_lower: -0.76
    tilt_limit_upper:  1.45

  # --- arms, two SO-101 on the cart top, IDs 1-6 (left on bus1, right on bus2) ---
  # The arm meshes, links and joints are those in simulation/xlerobot/xlerobot.urdf
  # of the XLeRobot repo (xlerobot_urdf.zip), zero pose stretched straight. All of
  # this is in the body frame, front is -x, the robot's left is +y there.
  # mount_x: the shoulder pan axes are at the mast's x (0.4.0 CAD,
  #   hardware/step/XLeRobot_040/XLeRobot040_armbase.step).
  # mount_y: pan axis position, 273 mm apart (CAD, confirmed on the robot). That URDF
  #   has them 310 mm apart.
  # mount_z: the cart top plate, that URDF's value, TODO measure on the robot.
  # left_yaw, right_yaw: rotation of each arm base about z, the 0.4.0 arm base can be
  #   mounted in any direction. At the zero pose the stretched arm points to the
  #   front with -1.5708, sideways with 0 or 3.14159, to the back with 1.5708. The
  #   shared URDF has the arms sideways (right 0, left 3.14159), the real robot has
  #   both pointing forward (official assembly video, confirmed by the user).
  arms:
    mount_x: 0.056
    mount_y: 0.1365
    mount_z: 0.775
    right_yaw: -1.57079633
    left_yaw: -1.57079633
