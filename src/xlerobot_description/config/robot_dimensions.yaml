# XLeRobot 0.4.0 two-wheel base, physical dimensions.
#
# These are measurements, not constants. Anything marked TODO is a guess and is
# probably wrong. See ARCHITECTURE.md, calibration section.

xlerobot:
  base:
    # --- odometry critical, do these first ---
    #
    # Measured directly off the drive wheel: 125mm outer diameter.
    wheel_radius: 0.0625

    # Distance between the two wheel contact patches. diff_drive_controller calls
    # it wheel_separation. Measured 550mm - wider than the cart body itself
    # (405-459mm across upstream's own chassis collision boxes) and wider than
    # upstream's own reference URDF track (0.45m, wheels at y=+-0.225): the
    # custom drive-wheel axle bar extends past the basket on both sides, unlike
    # the stock cart's wheels which sit roughly flush with the body edge.
    wheel_separation: 0.55

    # UMBmark correction if the two wheels are not equal. 1.0 until measured.
    wheel_radius_scale_left: 1.0
    wheel_radius_scale_right: 1.0

    wheel_width: 0.020          # measured
    wheel_mass: 0.15            # TODO

    # --- chassis ---
    # length/height still IKEA RASKOG nominal, TODO check against the real
    # build. width corrected from upstream's own chassis collision boxes
    # (0.405-0.459m depending which cross-section) - the old 0.350 guess was
    # narrower than the actual cart.
    body_length: 0.340
    body_width:  0.405
    body_height: 0.780
    # x of the body box centre in base_link (drive axle is x=0), matched to the
    # centre of raskogbody.stl's footprint (x=-0.048 to 0.344). TODO check
    # against the real cart's front and rear edges.
    body_x_offset: 0.119

    # axle height above floor. Measured 62.5mm, same as wheel_radius - the
    # mount is not recessed.
    axle_height: 0.0625

    # axle offset from base_link, positive is forward. TODO
    axle_x_offset: 0.0

    # Four generic casters (front left/right, rear left/right) - the stock
    # cart's original four wheels are all still there, the drive wheels are
    # an addition on their own axle bar, not a replacement for any of
    # them. No encoder on any of them, so each is a fixed sphere in the URDF.
    # Diameter measured 55mm.
    caster_radius: 0.0275
    # base_link frame, front is +x (the drive-wheel end, where the arms and the
    # head camera face). The cart body mesh spans x=-0.289 to x=0.052 (drive axle
    # is x=0), the casters sit just inside its ends, scaled with the mesh. Not measured against the real
    # robot's actual leg positions, just checked to not float in visibly empty
    # space, and taken from the shared upstream URDF's cart placement.
    caster_rear_x_offset: -0.259
    caster_front_x_offset: 0.045
    # TODO measure. Estimated from the corrected body_width (0.405m), not
    # measured directly - casters sit near the corners, inset a bit from
    # the body edge. Same value used for front and rear pairs.
    caster_y_offset: 0.15

    # Chassis only, no arms, no battery, no payload.
    # Don't copy the 70.1 kg from the upstream URDF, that is ManiSkill's loaded
    # cart scene and not this robot.
    # TODO weigh it.
    body_mass: 8.0
    com_height: 0.35            # TODO, this sets the tip over limits

  # --- speed limits ---
  # From the servo ceiling. Upstream clamps at max_raw = 3000 ticks/s:
  #   3000 / (4096/360) = 263.7 deg/s = 4.60 rad/s
  #   v_max = 4.60 * 0.0625 = 0.288 m/s
  # Keep Nav2 under these.
  limits:
    wheel_max_angular_velocity: 4.60   # rad/s, servo limit
    linear_velocity_max: 0.25          # m/s
    angular_velocity_max: 1.50         # rad/s
    # Low on purpose. Tall cart, two arms on top, narrow track.
    linear_acceleration_max: 0.30      # m/s^2
    angular_acceleration_max: 1.00     # rad/s^2

  # --- head pan/tilt, IDs 7 and 8 on bus1 ---
  head:
    # pan servo axis in the BODY frame (see base_2wheels.xacro: base_link turned 180
    # degrees about z, front is -x), the frame of the shared upstream URDF. The neck
    # and head parts are the ones in simulation/xlerobot/xlerobot.urdf of the
    # XLeRobot repo (xlerobot_urdf.zip).
    # x: measured, the mast axis is 70 mm behind the front rim of the top basket and
    #    the front rim is 22 mm ahead of the drive axle line, so the axis is 48 mm behind
    #    the axle line (0.048 here, the body frame has the front at -x).
    # z: measured, floor to the top of the pan servo where its axis meets the printed
    #    part, 1.118 m. In the upstream head meshes that junction is 0.073 m above the
    #    pan joint origin, which puts the origin 0.325 m above the top base, upstream
    #    has 0.323, so the neck matches upstream's (see head_pantilt.xacro).
    # camera_x: measured, the lens centre is 65 mm behind the front rim, 5 mm ahead of the
    #    pan axis (tilt frame, see head_pantilt.xacro).
    # camera_z: measured, floor to the head camera lens centre, 1.183 m, upstream's
    #    camera position gives 1.173. It is a plain USB camera, not the depth camera
    #    that URDF's head is made for.
    mount_x: 0.048
    mount_y: 0.0
    mount_z: 1.118
    camera_x: 0.004             # m in the tilt frame, upstream has 0.025
    camera_z: 1.183
    # that URDF's limits, TODO check against the mechanical stops
    pan_limit_lower: -3.2       # rad
    pan_limit_upper:  3.2
    tilt_limit_lower: -0.76
    tilt_limit_upper:  1.45
    # Servo calibration is tools/calibrate_arm.py --arm head, the head looking straight ahead
    # and level is step 2047, and that is the model's zero. direction: +1 if the servo step
    # increases with the joint angle, -1 if it decreases (what the driver reports natively,
    # see the arms below). Checked by moving the head by hand in Rerun.
    pan_zero_step: 2047
    pan_direction: -1
    tilt_zero_step: 2047
    tilt_direction: -1

  # --- arms, two SO-101 on the cart top, IDs 1-6 (left on bus1, right on bus2) ---
  # The arm meshes, links and joints are those in simulation/xlerobot/xlerobot.urdf
  # of the XLeRobot repo (xlerobot_urdf.zip), zero pose stretched straight. All of
  # this is in the body frame, front is -x, the robot's left is +y there.
  # mount_x: the shoulder pan axes are at the mast's x (0.4.0 CAD,
  #   hardware/step/XLeRobot_040/XLeRobot040_armbase.step).
  # mount_y: pan axis position, 273 mm apart (CAD, confirmed on the robot). That URDF
  #   has them 310 mm apart.
  # mount_z: measured, floor to the bottom of the arm base (its origin), 0.765 m.
  # left_yaw, right_yaw: rotation of each arm base about z, the 0.4.0 arm base can be
  #   mounted in any direction. At the zero pose the stretched arm points to the
  #   front with -1.5708, sideways with 0 or 3.14159, to the back with 1.5708. The
  #   shared URDF has the arms sideways (right 0, left 3.14159), the real robot has
  #   both pointing forward (official assembly video, confirmed by the user).
  arms:
    mount_x: 0.048
    mount_y: 0.1365
    mount_z: 0.765
    right_yaw: -1.57079633
    left_yaw: -1.57079633

    # The SO-101 joints. lower/upper are the limits of the shared upstream URDF, in its joint
    # direction, the same for both arms. The servos are calibrated with
    # tools/calibrate_arm.py (lerobot's procedure), which makes step 2047 the middle of each
    # joint's range, and these say how the model's joints relate to that:
    # zero_step: the servo step where the model's joint angle is 0 (arm stretched straight),
    #   per arm because each arm's middle was set by hand. Read off the arms held stretched
    #   straight (calibrate_arm.py status), except the gripper. The model's gripper is closed at its
    #   lower limit (-0.3745 rad, checked on the jaw meshes, joint angle 0 is open about 30 mm),
    #   so its zero is the closed end stop of the calibration (range_min) + 0.3745 rad = 244 steps.
    # direction: +1 if the servo step increases with the upstream joint angle, -1 if it
    #   decreases. The driver reports (center - step), so -1 is its own direction, and for +1
    #   so101_arm.xacro reverses the joint axis and mirrors the limits, which gives the same
    #   pose. Checked by moving every joint by hand in Rerun.
    # max_velocity: rad/s, the limit planners and trajectories plan with, low on purpose while the
    #   arms are new. servo_speed_limit_steps: the servos' own cap, in steps/s (4096 per turn),
    #   which a large jump of the command cannot exceed whatever the trajectory says. The cap
    #   applies to every commanded position joint on the bus, the head too.
    servo_speed_limit_steps: 600
    # limit_margin: rad added to both ends of every arm joint's limits, in the model and in
    #   ros2_control. The upstream limits are another arm's stops, and the folded rest pose sits
    #   at a hard stop that reads up to 2 degrees past them here (left elbow). A joint measured
    #   outside its limits makes the trajectory controller shut down. The servos' own
    #   calibrated range limits are the real stops.
    limit_margin: 0.1
    # rest_pose: the folded pose the arms rest in, in the model's joint angles (lift and elbow
    #   near their limits, the gripper closed at its limit), the same for both arms. The
    #   sim's arms start in it and MoveIt has it as the named state `rest`. The real arms rest
    #   a little differently, this one keeps clear of the hard stops.
    rest_pose: {shoulder_pan: 0.0, shoulder_lift: 2.6, elbow_flex: -3.0, wrist_flex: 0.0, wrist_roll: 0.0, gripper: 0.35}
    # folded_pose: the arms as they really lie when parked, folded to the hard stops (measured,
    #   the elbow at its stop). MoveIt must take it as a start state, the self-collision matrix
    #   is generated so that nothing this pose touches counts as a collision.
    folded_pose: {shoulder_pan: 0.15, shoulder_lift: 2.75, elbow_flex: -3.17, wrist_flex: 0.0, wrist_roll: 0.0, gripper: 0.37}
    joints:
      shoulder_pan:  {zero_step: {left: 2057, right: 2075}, direction:  1, max_velocity: 0.5, lower: -2.16,      upper: 2.16}
      shoulder_lift: {zero_step: {left: 3197, right: 3070}, direction: -1, max_velocity: 0.5, lower: -0.22,      upper: 3.37}
      elbow_flex:    {zero_step: {left:  989, right: 1056}, direction:  1, max_velocity: 0.5, lower: -0.22,      upper: 3.14}
      wrist_flex:    {zero_step: {left: 1978, right: 1991}, direction:  1, max_velocity: 0.5, lower: -1.6580628, upper: 1.6580627}
      wrist_roll:    {zero_step: {left: 2079, right: 2018}, direction: -1, max_velocity: 0.5, lower: -2.7438473, upper: 2.8412063}
      gripper:       {zero_step: {left: 1802, right: 1766}, direction:  1, max_velocity: 0.5, lower: -0.374533,  upper: 1.7453292}

  # --- LD19 2D lidar, upside down under the second basket ---
  # x, y: measured, centred and in line with the drive axle, base_link frame (front is +x).
  # mount_z: measured, floor to the housing's mounting surface, 0.420 m.
  # scan_below_mount: measured, the scan plane is 0.033 m from the mounting surface,
  #   so 0.387 m above the floor.
  # yaw: rotation of the lidar about z, base_link frame, counter-clockwise seen from above.
  #   Checked in the Rerun scan view on the robot.
  lidar:
    x: 0.0
    y: 0.0
    mount_z: 0.420
    scan_below_mount: 0.033
    yaw: 1.5707963
