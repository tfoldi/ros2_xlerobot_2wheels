# teleop_twist_joy config. Axis/button numbers are for a generic Xbox layout,
# check against upstream's software/examples/calibrate_gamepad.py mapping
# before trusting these, controller layouts vary by driver.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear.x: 1
    scale_linear.x: 0.25    # matches robot_dimensions.yaml linear_velocity_max
    axis_angular.yaw: 0
    scale_angular.yaw: 1.50 # matches angular_velocity_max
    enable_button: 4        # left bumper, deadman switch, deliberate choice
    require_enable_button: true
