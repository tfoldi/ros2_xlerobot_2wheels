# mcp_presence_guard config. Button number is for a generic Xbox layout, same caveat as
# joystick.yaml: check against upstream's software/examples/calibrate_gamepad.py mapping before
# trusting this, controller layouts vary by driver.
mcp_presence_guard:
  ros__parameters:
    presence_button: 5   # right bumper - deliberately not joystick.yaml's enable_button (4)
    timeout_sec: 5.0
