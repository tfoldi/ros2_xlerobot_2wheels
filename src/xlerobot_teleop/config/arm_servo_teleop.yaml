# arm_servo_teleop config.
#
# Confirmed button indices on this controller (2026-10-03, told directly by the user - A/B/X/Y
# do NOT follow the generic Xbox layout 0/1/2/3 this project kept assuming, there's a gap at 2):
# A=0, B=1, X=3, Y=4, LB=6, RB=7. Y=4 is joystick.yaml's enable_button (base drive deadman) and
# RB=7 is mcp_presence_guard's presence_button - neither read here, kept clear on purpose so
# driving/MCP-presence and arm-jog never compete for the same button.
#
# That leaves A(0)/B(1)/X(3)/LB(6) confirmed-free, used for the four button roles below.
#
# Every axis value below (stick/trigger/D-pad) is STILL an unverified guess - only the buttons
# above have been confirmed. Verify with `ros2 topic echo /joy` while actually moving each stick/
# trigger/D-pad direction before trusting any axis number here.
#
# Left stick (axes 0/1, per joystick.yaml) already drives the base - this node never reads those,
# so holding both the drive deadman and this node's enable_button at once is safe, they don't
# fight each other, they just also don't do anything useful together.
arm_servo_teleop:
  ros__parameters:
    enable_button: 1           # B - deadman, hold to jog, release instantly stops (zero cmd + pause)
    arm_select_button: 0       # A - tap while held: toggle active arm (starts on right)
    mode_button: 3             # X - tap while held: toggle JOINT_JOG <-> TWIST (starts on
                                # JOINT_JOG - the one that isn't singularity-prone, see project memory)

    # Right stick - Cartesian jog (TWIST mode) or two joints (JOINT_JOG mode, see below).
    # UNVERIFIED GUESS.
    axis_x: 3
    axis_y: 4
    # Z axis for TWIST mode - most layouts put L2/R2 here (trigger axes), separate from the
    # right stick so all three Cartesian dimensions are available without a mode chord.
    # UNVERIFIED GUESS.
    axis_z_up: 5
    axis_z_down: 2

    # Gripper - tap while held to toggle open/closed (open=-0.7 rad, closed=0.35 rad, matches
    # the SRDF's open/closed named states for {arm}_gripper, see tools/goto_position.py).
    gripper_toggle_button: 6   # LB

    # JOINT_JOG mode: right stick drives these two joints directly (axis_x -> first, axis_y ->
    # second); D-pad (axes 6/7 on most layouts, UNVERIFIED GUESS) drives the other two. No
    # joint-select step, so not every joint is reachable from the stick alone in v1 - wrist_roll
    # and the gripper still need their own test via tools/single_joint_test.py for fine control.
    joint_jog_axis_x_joint: wrist_flex_joint
    joint_jog_axis_y_joint: wrist_roll_joint
    joint_jog_dpad_x_axis: 6
    joint_jog_dpad_x_joint: shoulder_pan_joint
    joint_jog_dpad_y_axis: 7
    joint_jog_dpad_y_joint: elbow_flex_joint

    deadzone: 0.1
    publish_rate_hz: 50.0
