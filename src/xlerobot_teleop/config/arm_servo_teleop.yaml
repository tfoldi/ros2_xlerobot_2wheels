# arm_servo_teleop config. JOINT_JOG only - Servo's Cartesian (TWIST) mode was tried and
# dropped, see docs/decisions/0004-drop-cartesian-servo-jog.md.
#
# Confirmed button/axis layout on this controller (2026-10-03, told directly by the user - this
# controller does NOT follow the generic Xbox layout 0/1/2/3, there's a gap at 2): A=0, B=1,
# X=3, Y=4, LB=6, RB=7. Left stick [0,1], right stick [2,3], D-pad [6,7]. LT=8, RT=9 report as
# plain digital buttons on this controller/driver, not analog axes.
#
# Y is joystick.yaml's enable_button (base drive) and RB is mcp_presence_guard's
# presence_button as of 2026-10-03 (swapped from their previous Y/RB assignment so drive could
# move to RB) - neither read here, kept clear on purpose so driving/MCP-presence and arm-jog
# never compete for the same button.
#
# Both arms jog simultaneously while enable_button is held - left stick drives the left arm,
# right stick drives the right arm, no separate arm-select step (removed 2026-10-03, replaced
# by this side-to-side mapping per the user's own "looks more intuitive" call).
arm_servo_teleop:
  ros__parameters:
    enable_button: 6            # LB - deadman, hold to jog both arms, release instantly stops
                                 # (zero cmd + pause) both
    gripper_toggle_button: 0     # A - tap while held: toggle BOTH grippers open/closed together
                                  # (open=-0.7 rad, closed=0.35 rad, matches the SRDF's
                                  # open/closed named states, see tools/goto_position.py) - no
                                  # independent left/right gripper control here

    # Each arm's own stick, confirmed.
    left_axis_x: 0
    left_axis_y: 1
    right_axis_x: 2
    right_axis_y: 3

    # Each stick's X/Y drives these two joints on its own arm directly (so e.g. the right
    # stick's X drives right_arm_wrist_roll_joint, its Y drives right_arm_wrist_flex_joint -
    # swapped 2026-10-03 per live-test feedback, felt backwards the other way round). No
    # D-pad-driven third/fourth joint in this version (dropped when arm-select was removed,
    # since D-pad has no natural per-arm mapping) - the gripper still needs
    # tools/single_joint_test.py for fine per-joint control beyond these two.
    joint_jog_axis_x_joint: wrist_roll_joint
    joint_jog_axis_y_joint: wrist_flex_joint

    deadzone: 0.1
    publish_rate_hz: 50.0
