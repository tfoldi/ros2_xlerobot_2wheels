# The trajectory controllers of xlerobot_bringup (spawned with with_arms:=true torque_off:=false,
# always in the sim). MoveIt sends trajectories to their FollowJointTrajectory actions.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - left_gripper_controller
    - right_gripper_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_arm_shoulder_pan_joint, left_arm_shoulder_lift_joint, left_arm_elbow_flex_joint, left_arm_wrist_flex_joint, left_arm_wrist_roll_joint]
  left_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_arm_gripper_joint]
  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [right_arm_shoulder_pan_joint, right_arm_shoulder_lift_joint, right_arm_elbow_flex_joint, right_arm_wrist_flex_joint, right_arm_wrist_roll_joint]
  right_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [right_arm_gripper_joint]

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  # the arms are held by servos and read back a little off the last command
  allowed_start_tolerance: 0.1
