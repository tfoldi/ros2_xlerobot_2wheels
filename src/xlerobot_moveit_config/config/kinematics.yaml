# pick_ik with a position-only cost: the SO-101 arms have five joints, so a full 6D pose is out
# of reach in general. The gripper's orientation follows from the joint solution.
left_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.0
  position_threshold: 0.001
  orientation_threshold: 3.2
  cost_threshold: 0.001
  minimal_displacement_weight: 0.001
  gd_step_size: 0.0001
right_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.0
  position_threshold: 0.001
  orientation_threshold: 3.2
  cost_threshold: 0.001
  minimal_displacement_weight: 0.001
  gd_step_size: 0.0001
